name: Replay alert translations in TEST

on:
  push:
    branches: [fix/ground-alert-translations]

permissions:
  contents: read

env:
  RAILWAY_PROJECT_ID: 09fb396b-d91b-41b8-a70b-dd033d408e7d
  RAILWAY_ENVIRONMENT_ID: 661e15ae-8aad-4f10-9135-abe2adfdea92
  RAILWAY_SERVICE_ID: ed89feb6-f6a9-4cf4-8dbb-159de7439349

jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile monitor.py replay_alert_translations.py
      - run: python -m unittest discover -s tests -v
      - run: npm install --global @railway/cli
      - name: Replay with TEST routing and no deployment
        run: >-
          railway run
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
          --service "$RAILWAY_SERVICE_ID"
          env TEST_MODE=true python replay_alert_translations.py
