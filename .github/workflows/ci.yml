name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile monitor.py alert_rules.py predeploy_check.py
      - run: python -m unittest discover -s tests -v
      - name: Check UkraineAlarm API (read-only)
        env:
          UKRAINE_ALARM_API_KEY: ${{ secrets.UKRAINE_ALARM_API_KEY }}
        run: python check_ukraine_alarm_api.py
