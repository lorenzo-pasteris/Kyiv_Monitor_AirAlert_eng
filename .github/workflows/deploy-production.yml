name: Deploy production safely

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery:
        description: "Redeploy while the service is already offline"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: 09fb396b-d91b-41b8-a70b-dd033d408e7d
  RAILWAY_ENVIRONMENT_ID: 661e15ae-8aad-4f10-9135-abe2adfdea92
  RAILWAY_SERVICE_ID: ed89feb6-f6a9-4cf4-8dbb-159de7439349

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile monitor.py alert_rules.py predeploy_check.py
      - run: python -m unittest discover -s tests -v

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Synchronize UkraineAlarm API key without redeploying
        env:
          UKRAINE_ALARM_API_KEY: ${{ secrets.UKRAINE_ALARM_API_KEY }}
        run: |
          if [ -n "$UKRAINE_ALARM_API_KEY" ]; then
            printf '%s' "$UKRAINE_ALARM_API_KEY" | railway variable set UKRAINE_ALARM_API_KEY --stdin --skip-deploys --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID"
          else
            printf 'disabled' | railway variable set UKRAINE_ALARM_API_KEY --stdin --skip-deploys --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID"
            echo "UkraineAlarm credential removed from Railway; shadow mode disabled."
          fi

      - name: Stamp the deployment archive
        run: "printf '\\n# Deployment run: %s\\n' \"$GITHUB_RUN_ID\" >> monitor.py"

      - name: Stop the active worker
        if: github.event_name == 'push' || inputs.recovery == false
        run: railway down --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --yes

      - name: Allow Telegram to release the previous connection
        if: github.event_name == 'push' || inputs.recovery == false
        run: sleep 15

      - name: Deploy this tested commit
        run: >-
          railway up
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
          --service "$RAILWAY_SERVICE_ID"
          --ci
          --message "GitHub Actions $GITHUB_SHA"

      - name: Verify production status
        run: railway status --json
